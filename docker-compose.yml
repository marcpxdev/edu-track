services:
  postgres:
    image: postgres:15-alpine
    container_name: edutrack-db
    environment:
      POSTGRES_USER: edutrack
      POSTGRES_PASSWORD: edutrack
      POSTGRES_DB: edutrack
    ports:
      - "5432:5432"
    volumes:
      - edutrack-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack -d edutrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edutrack-db-data:
